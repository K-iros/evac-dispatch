# 调度作战板生产配置:静态托管 + /api 同源反代
# 关键点:
#  - gzip 压缩 API JSON(洪水帧单情景 8-12MB,压后约 1-2MB)
#  - /api 超长 read 超时:冷启动 /api/schedule 求解可达 486s,
#    严禁反代提前断开触发前端重试叠加并发计算
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip:JSON / JS / CSS
    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # 带 hash 的构建产物永久缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 自托管字形 pbf(内容稳定,长缓存减少首屏请求);
    # 超出 BMP 的 range(如 emoji 码位)上游字体库没有,用空字形兑底避免 404
    # (empty.pbf 为合法空 glyph 文件,emoji 标签降级为不显示而非阻塞渲染)
    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri /fonts/empty.pbf;
    }

    # 落地页(compose 只读卷挂载,随 git pull 更新不重建镜像);
    # 页面与配图均无 hash 且会原名覆盖更新,no-cache 强制协商缓存
    # (304 复用未变资源),避免访客看到旧版页面/旧截图
    location /intro/ {
        add_header Cache-Control "no-cache";
    }

    # 后端反代
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
    }

    # SPA 回退; index.html 禁用启发式缓存,确保发版后普通刷新即可拿到新 bundle
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
